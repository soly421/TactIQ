# One-click deploy blueprint for Render (render.com).
# New > Blueprint > point at this repo/branch, set the secret env vars, deploy.
#
# Production checklist:
#   - ANTHROPIC_API_KEY and/or OPENAI_API_KEY (at least one; both = failover)
#   - JWT_SECRET: long random string (sessions invalidate if it changes)
#   - Stripe (Pro tier): STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
#     STRIPE_PRICE_ID_PRO, PUBLIC_URL (e.g. https://tactiq.onrender.com)
#   Stripe promotion codes to create:
#     FOUNDING100 — applies a permanent $14.99/mo price to the monthly Pro
#       subscription (founding coaches keep it for life), max 100 redemptions.
#       Simplest setup: a second recurring price at $14.99 + promo code that
#       swaps to it, or a 50% forever coupon on the $29.99 price.
#     FOUNDING50 — club-seat subscriptions: 50% off for 12 months, max 10
#       redemptions (the Founding Club offer).
#     Webhook endpoint in the Stripe dashboard: <PUBLIC_URL>/api/billing/webhook
#     with events: checkout.session.completed, customer.subscription.updated,
#     customer.subscription.deleted
#   - Attach a persistent disk mounted at /data so the database survives
#     deploys (free tier has no disk — data resets on redeploy).
services:
  - type: web
    name: tactiq
    runtime: docker
    plan: starter # persistent disk requires a paid instance; use "free" to demo
    healthCheckPath: /api/health
    disk:
      name: tactiq-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false # set in the Render dashboard
      - key: OPENAI_API_KEY
        sync: false # optional second provider (failover)
      - key: PREFERRED_PROVIDER
        value: anthropic
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /data/tactiq.db
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false # $29.99/mo monthly price
      - key: STRIPE_PRICE_ID_PRO_ANNUAL
        sync: false # $299/yr annual price (2 months free vs monthly)
      - key: STRIPE_PRICE_ID_CLUB_SEAT
        sync: false # $14.99/seat/mo, quantity = seats (server enforces 10-seat minimum)
      - key: RESEND_API_KEY
        sync: false # enables weekly digest emails + password reset
      - key: TEAMSNAP_CLIENT_ID
        sync: false # optional: TeamSnap OAuth schedule sync
      - key: TEAMSNAP_CLIENT_SECRET
        sync: false
      - key: EMAIL_FROM
        sync: false # e.g. "TactIQ <coach@updates.yourdomain.com>"
      - key: PUBLIC_URL
        sync: false # your public https URL, used for Stripe redirect links
      - key: PORT
        value: "8787"
